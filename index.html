<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5" />
<title>童軍小工具</title>
<meta name="description" content="童軍小工具 — 童軍 Apps／學習圖卡／PPT／有用連結 的分類展示櫃，一個入口打開全部" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" type="image/png" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="application-name" content="童軍小工具" />
<meta name="apple-mobile-web-app-title" content="童軍小工具" />
<meta name="format-detection" content="telephone=no" />
<style>
  :root {
    --bg: #f2f4f8;
    --bg-elevated: #ffffff;
    --bg-card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --border: rgba(15, 23, 42, .08);
    --border-strong: rgba(15, 23, 42, .14);
    --accent: #2563eb;
    --accent-2: #7c3aed;
    --accent-soft: rgba(37, 99, 235, .1);
    --accent-text: #1d4ed8;
    --danger: #ef4444;
    --danger-soft: rgba(239, 68, 68, .1);
    --ok: #059669;
    --ok-soft: rgba(5, 150, 105, .1);
    --warn: #d97706;
    --warn-soft: rgba(217, 119, 6, .12);
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, .04);
    --shadow: 0 2px 8px rgba(15, 23, 42, .06), 0 8px 24px rgba(15, 23, 42, .06);
    --shadow-hover: 0 8px 28px rgba(15, 23, 42, .14);
    --radius: 18px;
    --radius-sm: 12px;
    --radius-xs: 10px;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
    --header-h: 0px;
    --pnav-h: 0px;
    --chip-h: 52px;
    --ease: cubic-bezier(.22, 1, .36, 1);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
      "PingFang HK", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC",
      "Helvetica Neue", Arial, sans-serif;
  }
  [data-theme="dark"] {
    --bg: #0b0d12;
    --bg-elevated: #12151c;
    --bg-card: #151922;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --border: rgba(255, 255, 255, .07);
    --border-strong: rgba(255, 255, 255, .12);
    --accent: #60a5fa;
    --accent-2: #a78bfa;
    --accent-soft: rgba(96, 165, 250, .14);
    --accent-text: #93c5fd;
    --danger: #f87171;
    --danger-soft: rgba(248, 113, 113, .14);
    --ok: #34d399;
    --ok-soft: rgba(52, 211, 153, .12);
    --warn: #fbbf24;
    --warn-soft: rgba(251, 191, 36, .14);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .35);
    --shadow: 0 2px 8px rgba(0, 0, 0, .35), 0 10px 28px rgba(0, 0, 0, .35);
    --shadow-hover: 0 10px 32px rgba(0, 0, 0, .5);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    line-height: 1.55;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
    transition: background .3s var(--ease), color .3s var(--ease);
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(900px 480px at 12% -8%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 60%),
      radial-gradient(700px 420px at 100% 0%, color-mix(in srgb, var(--accent-2) 14%, transparent), transparent 55%);
    opacity: .9;
  }
  a { color: inherit; text-decoration: none; }
  button, input, select { font: inherit; color: inherit; }
  img { display: block; max-width: 100%; }
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .wrap {
    max-width: 960px;
    margin: 0 auto;
    padding:
      calc(12px + var(--safe-t))
      max(16px, var(--safe-r))
      calc(48px + var(--safe-b))
      max(16px, var(--safe-l));
  }

  /* ── Sticky top bar ─────────────────── */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 40;
    margin: 0 calc(-1 * max(16px, var(--safe-l))) 0 calc(-1 * max(16px, var(--safe-r)));
    padding: 10px max(16px, var(--safe-r)) 0 max(16px, var(--safe-l));
    background: color-mix(in srgb, var(--bg) 78%, transparent);
    backdrop-filter: saturate(1.4) blur(16px);
    -webkit-backdrop-filter: saturate(1.4) blur(16px);
    border-bottom: 1px solid transparent;
    transition: border-color .2s, box-shadow .2s;
  }
  .topbar.scrolled {
    border-bottom-color: var(--border);
    box-shadow: 0 8px 24px rgba(15, 23, 42, .04);
  }
  [data-theme="dark"] .topbar.scrolled { box-shadow: 0 8px 24px rgba(0,0,0,.25); }

  header { padding: 6px 0 4px; }
  .head-row { display: flex; align-items: center; gap: 12px; }
  .head-logo-wrap {
    flex-shrink: 0; cursor: default;
    -webkit-user-select: none; user-select: none;
    border-radius: 14px;
  }
  .head-logo {
    width: 44px; height: 44px; border-radius: 14px;
    box-shadow: var(--shadow); display: block;
  }
  .head-titles { min-width: 0; flex: 1; }
  .head-titles h1 {
    font-size: clamp(20px, 5vw, 25px);
    font-weight: 750; letter-spacing: -.02em;
    line-height: 1.2;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .head-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-shrink: 0; }

  .icon-btn {
    width: 42px; height: 42px; min-width: 42px; border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg-card); color: var(--text); font-size: 17px;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-sm);
    transition: transform .15s var(--ease), background .15s, border-color .15s;
    touch-action: manipulation;
  }
  .icon-btn:hover { border-color: var(--border-strong); transform: scale(1.05); }
  .icon-btn:active { transform: scale(.94); }

  .install-btn {
    display: none; align-items: center; gap: 6px;
    border: none; border-radius: 999px; padding: 10px 14px; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; font-size: 13px; font-weight: 700;
    box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 35%, transparent);
    white-space: nowrap; touch-action: manipulation;
    transition: filter .15s, transform .15s var(--ease);
  }
  .install-btn:hover { filter: brightness(1.06); }
  .install-btn:active { transform: scale(.96); }
  @media (max-width: 420px) {
    .install-btn .install-label { display: none; }
    .install-btn { padding: 10px 12px; }
  }

  /* Search */
  .search-wrap { position: relative; margin-top: 12px; padding-bottom: 4px; }
  .search {
    width: 100%;
    padding: 14px 44px 14px 44px;
    border-radius: 16px;
    font-size: 17px; /* iOS 唔會自動 zoom */
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text);
    outline: none;
    box-shadow: var(--shadow-sm);
    transition: border-color .15s, box-shadow .15s;
    -webkit-appearance: none; appearance: none;
  }
  .search::placeholder { color: var(--muted); opacity: .85; }
  .search:focus {
    border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
    box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow-sm);
  }
  .search-ico {
    position: absolute; left: 15px; top: 50%; transform: translateY(calc(-50% - 2px));
    font-size: 15px; pointer-events: none; opacity: .7;
  }
  .search-clear {
    position: absolute; right: 8px; top: 50%; transform: translateY(calc(-50% - 2px));
    width: 34px; height: 34px; border-radius: 50%; border: none;
    background: transparent; color: var(--muted); font-size: 18px;
    cursor: pointer; display: none; align-items: center; justify-content: center;
    touch-action: manipulation;
  }
  .search-clear.show { display: inline-flex; }
  .search-clear:hover { background: var(--accent-soft); color: var(--accent-text); }

  /* ── Category chips ─────────────────── */
  .chips {
    position: sticky;
    top: calc(var(--header-h, 0px) + var(--pnav-h, 0px));
    z-index: 30;
    display: flex; gap: 8px; overflow-x: auto; overflow-y: hidden;
    padding: 10px 2px 12px;
    margin: 0 -2px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: x proximity;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; white-space: nowrap; cursor: pointer;
    font-size: 15px; font-weight: 650; color: var(--muted);
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 999px; padding: 10px 17px;
    box-shadow: var(--shadow-sm);
    transition: all .18s var(--ease);
    scroll-snap-align: start;
    touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
  }
  .chip:hover { color: var(--text); border-color: var(--border-strong); }
  .chip:active { transform: scale(.96); }
  .chip.on {
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-color: transparent;
    box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 32%, transparent);
  }
  [data-theme="dark"] .chip.on { color: #0b0d12; }

  /* ── Sections ───────────────────────── */
  #sections { min-height: 120px; }
  section {
    margin-top: 22px;
    scroll-margin-top: calc(var(--header-h, 64px) + var(--pnav-h, 0px) + var(--chip-h, 52px) + 8px);
  }
  .sec-head {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 14px; padding: 0 2px;
  }
  .sec-head .sec-ico { font-size: 20px; line-height: 1; }
  .sec-head h2 {
    font-size: 17.5px; font-weight: 750; letter-spacing: -.01em;
  }
  .sec-head .num {
    font-size: 13px; font-weight: 700; color: var(--muted);
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 999px; padding: 2px 8px; margin-left: 2px;
  }

  .grid {
    display: grid;
    gap: 14px 8px;
    grid-template-columns: repeat(4, 1fr);
  }
  @media (min-width: 420px) { .grid { grid-template-columns: repeat(5, 1fr); gap: 16px 10px; } }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(6, 1fr); gap: 18px 12px; } }
  @media (min-width: 760px) { .grid { grid-template-columns: repeat(7, 1fr); } }
  @media (min-width: 920px) { .grid { grid-template-columns: repeat(8, 1fr); } }

  /* ── App tile ───────────────────────── */
  .tile {
    text-align: center; cursor: pointer; position: relative;
    display: flex; flex-direction: column; align-items: center;
    padding: 6px 2px 4px;
    border-radius: 16px;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
    transition: background .15s;
    animation: tileIn .45s var(--ease) both;
  }
  .tile:hover { background: color-mix(in srgb, var(--bg-card) 70%, transparent); }
  .tile:active .tile-icon { transform: scale(.88); }
  @keyframes tileIn {
    from { opacity: 0; transform: translateY(10px) scale(.96); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .tile { animation: none; }
    * { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }

  .tile-icon {
    width: 68px; height: 68px; margin: 0 auto 8px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; position: relative;
    background: transparent !important;
    box-shadow: none;
    transition: transform .15s var(--ease);
    overflow: visible;
  }
  @media (min-width: 560px) {
    .tile-icon { width: 76px; height: 76px; border-radius: 18px; font-size: 42px; }
  }
  .tile:hover .tile-icon {
    transform: translateY(-3px) scale(1.06);
  }
  .tile-icon img {
    width: 58px; height: 58px; object-fit: contain; border-radius: 14px;
  }
  @media (min-width: 560px) {
    .tile-icon img { width: 66px; height: 66px; }
  }
  .tile-name {
    font-size: 13.5px; font-weight: 600; color: var(--text); line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; word-break: break-word;
    max-width: 100%; padding: 0 2px;
  }
  .tile-desc {
    font-size: 12px; color: var(--muted); line-height: 1.35; margin-top: 3px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; max-width: 100%; padding: 0 2px;
  }
  @media (max-width: 380px) {
    .tile-desc { display: none; } /* 細屏隱藏描述，圖標更大空間 */
  }

  /* 我的最愛星星 */
  .fav-star {
    position: absolute; top: 0; right: 0; z-index: 5;
    width: 24px; height: 24px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: var(--muted); opacity: 0.35;
    transition: opacity .15s, color .15s, transform .15s;
    touch-action: manipulation;
  }
  .fav-star::after { content: "☆"; }
  .fav-star:hover { opacity: 0.7; transform: scale(1.15); }
  .fav-star.on { opacity: 1; color: #f59e0b; }
  .fav-star.on::after { content: "★"; }

  .gh-badge {
    position: absolute; top: 2px; right: 2px; z-index: 2;
    font-size: 9px; font-weight: 800; letter-spacing: .04em;
    background: #111827; color: #fff; border-radius: 999px;
    padding: 3px 6px; cursor: pointer;
    border: 2px solid var(--bg);
    box-shadow: var(--shadow-sm);
    min-width: 28px; min-height: 22px;
    display: inline-flex; align-items: center; justify-content: center;
    touch-action: manipulation;
  }
  [data-theme="dark"] .gh-badge { background: #e2e8f0; color: #0f172a; }

  /* Empty / loading */
  .empty {
    text-align: center; color: var(--muted);
    padding: 56px 16px; display: none;
  }
  .empty-ico {
    width: 72px; height: 72px; margin: 0 auto 14px; border-radius: 22px;
    background: var(--bg-card); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; box-shadow: var(--shadow-sm);
  }
  .empty b { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }
  .empty p { font-size: 13.5px; }

  .skeleton {
    display: grid; gap: 14px 8px;
    grid-template-columns: repeat(4, 1fr);
    margin-top: 22px;
  }
  @media (min-width: 560px) { .skeleton { grid-template-columns: repeat(6, 1fr); } }
  .sk-tile {
    display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 6px;
  }
  .sk-icon, .sk-line {
    background: linear-gradient(90deg,
      color-mix(in srgb, var(--muted) 12%, transparent) 0%,
      color-mix(in srgb, var(--muted) 22%, transparent) 50%,
      color-mix(in srgb, var(--muted) 12%, transparent) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.2s ease-in-out infinite;
    border-radius: 16px;
  }
  .sk-icon { width: 60px; height: 60px; }
  .sk-line { height: 10px; width: 70%; border-radius: 6px; }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* Footer */
  footer {
    text-align: center; color: var(--muted);
    font-size: 14px; padding-top: 36px; line-height: 1.8;
  }
  footer a { color: var(--accent-text); font-weight: 600; }
  footer .tip {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px; margin: 0 auto 18px; max-width: 560px;
    text-align: left; box-shadow: var(--shadow-sm);
    font-size: 15px; line-height: 1.6;
  }
  footer .tip b { color: var(--text); }
  .foot-meta {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 999px; padding: 8px 16px; font-size: 14px; font-weight: 600;
    box-shadow: var(--shadow-sm);
  }

  /* Back to top */
  .to-top {
    position: fixed;
    right: max(14px, var(--safe-r));
    bottom: calc(18px + var(--safe-b));
    width: 46px; height: 46px; border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg-card); color: var(--text);
    box-shadow: var(--shadow);
    font-size: 18px; cursor: pointer;
    display: none; align-items: center; justify-content: center;
    z-index: 50; touch-action: manipulation;
    transition: transform .15s var(--ease), opacity .2s;
  }
  .to-top.show { display: inline-flex; }
  .to-top:active { transform: scale(.92); }

  /* ── Admin panel ──────────────────── */
  [hidden] { display: none !important; }
  #admin-panel {
    position: fixed; inset: 0; background: var(--bg); z-index: 100;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding:
      calc(8px + var(--safe-t))
      max(12px, var(--safe-r))
      calc(40px + var(--safe-b))
      max(12px, var(--safe-l));
  }
  .admin-card {
    max-width: 680px; margin: 16px auto;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 20px; padding: 18px;
    box-shadow: var(--shadow);
  }
  .admin-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .admin-logo {
    width: 40px; height: 40px; border-radius: 12px;
    cursor: default; -webkit-user-select: none; user-select: none;
  }
  .admin-card h2 { font-size: 17px; font-weight: 750; margin-bottom: 2px; letter-spacing: -.01em; }
  .admin-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
  .admin-card input, .admin-card select {
    flex: 1; min-width: 120px; min-height: 44px;
    padding: 10px 12px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    font-size: 16px; /* 防 iOS zoom */
    -webkit-appearance: none; appearance: none;
  }
  .admin-card input:focus, .admin-card select:focus {
    border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
    outline: none;
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .admin-lbl {
    font-size: 12px; color: var(--muted); margin-top: 14px;
    margin-bottom: 6px; font-weight: 750; letter-spacing: .02em;
  }
  .admin-app-row {
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px;
    padding: 12px 4px; border-bottom: 1px solid var(--border); font-size: 14px;
  }
  .admin-app-row:last-child { border-bottom: none; }
  .admin-app-row > b { font-weight: 700; }
  .admin-app-row .u {
    color: var(--muted); font-size: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    flex: 1 1 140px; min-width: 0;
  }
  .admin-app-actions {
    display: flex; flex-wrap: wrap; gap: 6px;
    width: 100%;
  }
  @media (min-width: 560px) {
    .admin-app-actions { width: auto; margin-left: auto; }
  }
  .admin-cat-head {
    display: flex; align-items: center; gap: 6px;
    margin: 16px 0 6px; padding: 8px 10px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 12px;
  }
  .admin-cat-head span:first-child { font-size: 13.5px; font-weight: 750; }
  .admin-actions {
    margin-top: 18px; display: flex; gap: 8px; flex-wrap: wrap;
  }
  .admin-actions .spacer { flex: 1 1 8px; min-width: 0; }
  @media (max-width: 480px) {
    .admin-actions .spacer { display: none; }
    .admin-actions .mini-btn { flex: 1 1 calc(50% - 8px); justify-content: center; text-align: center; }
    .admin-actions .mini-btn.primary,
    .admin-actions .mini-btn.full { flex: 1 1 100%; }
  }

  .mini-btn {
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    border-radius: 11px; padding: 9px 13px; font-size: 13px; font-weight: 650;
    cursor: pointer; min-height: 40px;
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    touch-action: manipulation;
    transition: border-color .15s, background .15s, transform .12s;
  }
  .mini-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
  .mini-btn:active { transform: scale(.97); }
  .mini-btn.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; border-color: transparent;
    box-shadow: 0 6px 14px color-mix(in srgb, var(--accent) 28%, transparent);
  }
  [data-theme="dark"] .mini-btn.primary { color: #0b0d12; }
  .mini-btn.danger { color: var(--danger); }
  .mini-btn.danger:hover { background: var(--danger-soft); border-color: var(--danger); }
  .mini-btn.iconish { min-width: 40px; padding-left: 10px; padding-right: 10px; }

  .banner {
    font-size: 13px; border-radius: 12px; padding: 11px 13px;
    margin: 10px 0; line-height: 1.5;
  }
  .banner.warn { background: var(--warn-soft); color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); }
  .banner.ok { background: var(--ok-soft); color: var(--ok); border: 1px solid color-mix(in srgb, var(--ok) 30%, transparent); }

  .tab-bar {
    display: flex; gap: 6px; margin: 12px 0 6px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 14px; padding: 4px;
  }
  .tab-btn {
    flex: 1; border: none; background: transparent; color: var(--muted);
    border-radius: 11px; padding: 10px 12px; font-size: 13.5px; font-weight: 750;
    cursor: pointer; touch-action: manipulation;
    transition: background .15s, color .15s, box-shadow .15s;
  }
  .tab-btn.on {
    background: var(--bg-card); color: var(--accent-text);
    box-shadow: var(--shadow-sm);
  }

  .lock-tag {
    display: inline-block; font-size: 10.5px; font-weight: 750;
    color: var(--warn); background: var(--warn-soft);
    border-radius: 999px; padding: 2px 8px; white-space: nowrap;
  }
  .vis-lbl {
    position: relative;
    font-size: 14px; color: var(--text);
    display: flex; align-items: center; gap: 10px; cursor: pointer;
    min-height: 44px; user-select: none;
    padding: 6px 12px 6px 8px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--bg);
    transition: all .16s var(--ease);
  }
  .vis-lbl input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .vis-lbl .vis-txt { font-weight: 800; color: var(--muted); }
  .vis-lbl.on {
    border-color: color-mix(in srgb, var(--ok) 40%, transparent);
    background: var(--ok-soft);
  }
  .vis-lbl.on .vis-txt { color: var(--ok); }

  .login-wrap {
    min-height: calc(100dvh - 80px);
    display: flex; align-items: center; justify-content: center;
  }
  .login-wrap .admin-card { width: 100%; max-width: 400px; margin: 0; }

  /* ── 分頁導覽 ─────────────────────────── */
  .page-nav {
    position: sticky;
    top: var(--header-h, 0px);
    z-index: 35;
    display: flex; gap: 6px; overflow-x: auto;
    padding: 8px 2px 4px; margin: 8px -2px 0;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .page-nav[hidden] { display: none; }
  .page-nav::-webkit-scrollbar { display: none; }
  .page-btn {
    flex-shrink: 0; white-space: nowrap; cursor: pointer;
    font-size: 15px; font-weight: 750; color: var(--muted);
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 999px; padding: 10px 15px; min-height: 42px;
    box-shadow: var(--shadow-sm); touch-action: manipulation;
    transition: all .18s var(--ease);
  }
  .page-btn:hover { color: var(--text); border-color: var(--border-strong); }
  .page-btn.on {
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-color: transparent; box-shadow: 0 5px 14px color-mix(in srgb, var(--accent) 30%, transparent);
  }
  [data-theme="dark"] .page-btn.on { color: #0b0d12; }
  .page-btn[data-page="__prev"], .page-btn[data-page="__next"] {
    font-size: 17px; padding: 8px 10px; flex-shrink: 0;
  }
  .page-btn[data-page="__prev"][disabled], .page-btn[data-page="__next"][disabled] { opacity: .35; pointer-events: none; }

  /* ── 童軍級別篩選列 ───────────────────── */
  .tag-row {
    display: flex; align-items: center; gap: 6px; overflow-x: auto;
    padding: 8px 2px 4px; margin: 2px -2px 0;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .tag-row[hidden] { display: none; }
  .tag-row::-webkit-scrollbar { display: none; }
  .tag-row-hint {
    font-size: 14px; color: var(--muted); font-weight: 700;
    white-space: nowrap; padding-right: 2px;
  }
  .tag-chip {
    flex-shrink: 0; white-space: nowrap; cursor: pointer;
    font-size: 14px; font-weight: 700; color: var(--accent-text);
    background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    border-radius: 999px; padding: 8px 14px; touch-action: manipulation;
    transition: all .18s var(--ease);
  }
  .tag-chip.on {
    color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent;
  }
  [data-theme="dark"] .tag-chip.on { color: #0b0d12; }

  /* tile 內嘅級別小標籤 */
  .tile-tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; margin-top: 3px; }
  .tile-tags span {
    font-size: 10.5px; font-weight: 700; color: var(--accent-text);
    background: var(--accent-soft); border-radius: 999px; padding: 2px 6px;
  }
  .mini-tag-row { display: inline-flex; gap: 3px; flex-wrap: wrap; }
  .mini-tag {
    font-size: 10px; font-weight: 700; color: var(--accent-text);
    background: var(--accent-soft); border-radius: 999px; padding: 1px 6px;
  }
  .num-badge {
    font-size: 10.5px; font-weight: 700; color: var(--muted);
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 999px; padding: 2px 8px; white-space: nowrap;
  }

  /* 管理：分頁 block */
  .page-block {
    border: 1px solid var(--border); border-radius: 14px;
    padding: 12px 12px 14px; margin-top: 14px;
    background: color-mix(in srgb, var(--bg) 40%, transparent);
  }
  .page-block-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .page-ico { font-size: 22px; }
  .page-meta { flex: 1; min-width: 120px; }
  .page-title { font-weight: 750; font-size: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .page-on {
    position: relative;
    display: inline-flex; align-items: center; gap: 9px;
    font-size: 12.5px; font-weight: 800; cursor: pointer; user-select: none;
    padding: 7px 12px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--bg);
    transition: all .16s var(--ease);
    -webkit-tap-highlight-color: transparent;
  }
  .page-on input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .page-on .page-on-txt { color: var(--muted); white-space: nowrap; }
  .page-on.on {
    border-color: color-mix(in srgb, var(--ok) 40%, transparent);
    background: var(--ok-soft);
  }
  .page-on.on .page-on-txt { color: var(--ok); }
  .page-sublabel {
    font-size: 12.5px; font-weight: 800; letter-spacing: .02em;
    color: var(--accent-text); margin: 4px 2px 0; text-transform: none;
  }
  /* 後台列表／標題用嘅細 icon（預設 = 我哋 Logo） */
  .row-ico {
    width: 20px; height: 20px; border-radius: 6px; object-fit: contain;
    vertical-align: -5px;
  }
  /* 公開版分類標題：冇 emoji 就用 Logo */
  .sec-ico-logo {
    width: 18px; height: 18px; border-radius: 5px; object-fit: contain;
  }

  /* 管理：級別標籤（藥丸＋勾選框，選中一眼分明） */
  .tag-check-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag-check {
    position: relative; display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 700; cursor: pointer; user-select: none;
    padding: 9px 14px; border-radius: 999px;
    border: 1.5px solid var(--border-strong); background: var(--bg-card);
    color: var(--muted);
    transition: all .16s var(--ease);
    -webkit-tap-highlight-color: transparent;
  }
  .tag-check:hover { border-color: var(--accent); color: var(--accent-text); }
  .tag-check:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tag-check input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .tc-box {
    width: 18px; height: 18px; border-radius: 6px; flex-shrink: 0;
    border: 2px solid var(--border-strong); background: var(--bg);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 900; line-height: 1; color: transparent;
    transition: all .16s var(--ease);
  }
  .tag-check.on {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-color: transparent; color: #fff;
    box-shadow: 0 5px 14px color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .tag-check.on .tc-box {
    background: rgba(255, 255, 255, .3);
    border-color: rgba(255, 255, 255, .95); color: #fff;
  }
  .tag-check.on .tc-box::after { content: "✓"; }
  [data-theme="dark"] .tag-check.on { color: #0b0d12; }
  [data-theme="dark"] .tag-check.on .tc-box {
    background: rgba(0, 0, 0, .22); border-color: #0b0d12; color: #0b0d12;
  }

  /* 圖示來源 4 選 1 */
  .icon-src-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 8px; }
  .icon-src-opt {
    display: flex; align-items: center; gap: 6px; cursor: pointer;
    padding: 8px 10px; border-radius: 12px; min-height: 38px;
    background: var(--bg-elevated); color: var(--text);
    border: 1.5px solid var(--border);
    font-size: 13px; font-weight: 600;
    transition: border-color .15s, background .15s, color .15s;
  }
  .icon-src-opt:hover { border-color: var(--accent); }
  .icon-src-opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .icon-src-opt .iso-dot {
    width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0;
    background: #fff; border: 1.5px solid var(--border);
    box-shadow: inset 0 1px 2px rgba(15,23,42,.15);
  }
  .icon-src-opt.on {
    border-color: var(--accent); background: var(--accent-soft); color: var(--accent-text);
  }
  .icon-src-opt.on .iso-dot { background: var(--accent); border-color: var(--accent); box-shadow: inset 0 0 0 3px #fff; }
  .icon-src-opt .iso-hint { font-weight: 500; color: var(--muted); font-size: 12px; }
  [data-theme="dark"] .icon-src-opt.on { color: #0b0d12; }
  [data-theme="dark"] .icon-src-opt.on .iso-dot { box-shadow: inset 0 0 0 3px var(--bg-elevated); }

  /* 開關掣（分頁開放／項目公開顯示共用） */
  .switch {
    position: relative; flex-shrink: 0;
    width: 46px; height: 28px; border-radius: 999px;
    background: #c6cedb; box-shadow: inset 0 1px 3px rgba(15, 23, 42, .18);
    transition: background .18s var(--ease);
  }
  .switch::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 22px; height: 22px; border-radius: 50%;
    background: #fff; box-shadow: 0 2px 5px rgba(15, 23, 42, .3);
    transition: transform .18s var(--ease);
  }
  [data-theme="dark"] .switch { background: #3a4150; }
  input:checked + .switch { background: var(--ok); }
  input:checked + .switch::after { transform: translateX(18px); }
  input:focus-visible + .switch { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* emoji picker */
  .emoji-panel {
    position: fixed; inset: 0; z-index: 300; display: flex;
    align-items: center; justify-content: center; padding: 20px;
    background: rgba(0,0,0,.4); backdrop-filter: blur(2px);
  }
  .emoji-panel[hidden] { display: none; }
  .emoji-panel-inner {
    width: 100%; max-width: 440px; max-height: 78dvh; overflow-y: auto;
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 18px; padding: 14px; box-shadow: var(--shadow-hover);
  }
  .emoji-panel-head { display: flex; align-items: center; font-weight: 750; font-size: 14px; margin-bottom: 10px; }
  .emoji-panel-head .spacer { flex: 1; }
  .emoji-search {
    width: 100%; min-height: 42px; padding: 9px 12px; margin-bottom: 8px;
    border-radius: 11px; border: 1px solid var(--border); background: var(--bg);
    color: var(--text); font-size: 15px; -webkit-appearance: none; appearance: none;
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .emoji-search:focus { border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); box-shadow: 0 0 0 3px var(--accent-soft); }
  .emoji-tabs {
    position: sticky; top: 0; z-index: 2;
    display: flex; gap: 6px; overflow-x: auto;
    padding: 2px 0 8px; margin-bottom: 2px;
    background: var(--bg-elevated);
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .emoji-tabs::-webkit-scrollbar { display: none; }
  .emoji-tab {
    flex-shrink: 0; white-space: nowrap; cursor: pointer;
    font-size: 13px; font-weight: 700; color: var(--muted);
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 999px; padding: 7px 12px; touch-action: manipulation;
    transition: all .15s var(--ease);
  }
  .emoji-tab:hover { color: var(--text); border-color: var(--border-strong); }
  .emoji-tab.on {
    color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-color: transparent;
  }
  [data-theme="dark"] .emoji-tab.on { color: #0b0d12; }
  .emoji-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 6px; }
  .emoji-cell {
    aspect-ratio: 1; font-size: 24px; border: 1px solid var(--border);
    background: var(--bg); border-radius: 12px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .12s, background .15s, border-color .15s;
  }
  .emoji-cell:hover { transform: scale(1.1); border-color: var(--accent); background: var(--accent-soft); }
  .emoji-total { font-size: 12px; color: var(--muted); align-self: center; margin-left: auto; }
  .emoji-none-hint {
    grid-column: 1 / -1; text-align: left;
    font-size: 12.5px; color: var(--muted); line-height: 1.5;
    background: var(--bg); border: 1px dashed var(--border-strong);
    border-radius: 10px; padding: 12px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar" id="topbar">
    <header>
      <div class="head-row">
        <div class="head-logo-wrap" onclick="goldfingerClick()" role="img" aria-label="Logo">
          <img class="head-logo" src="/icons/icon-192.png" alt="Scout System" width="44" height="44" />
        </div>
        <div class="head-titles">
          <h1 id="site-name">童軍小工具</h1>
        </div>
        <div class="head-actions">
          <button class="install-btn" id="install-btn" type="button" aria-label="安裝 App">
            ⬇️ <span class="install-label">安裝</span>
          </button>
          <button class="icon-btn" id="theme-btn" type="button" title="切換深色 / 淺色" aria-label="切換主題">🌙</button>
        </div>
      </div>
      <div class="search-wrap">
        <span class="search-ico" aria-hidden="true">🔍</span>
        <input class="search" id="search" type="search" enterkeyhint="search" placeholder="搜尋項目／分類／級別…" aria-label="搜尋" autocomplete="off" />
        <button class="search-clear" id="search-clear" type="button" aria-label="清除搜尋">×</button>
      </div>
    </header>
  </div>

  <nav class="page-nav" id="page-nav" aria-label="分頁" hidden></nav>
  <div class="tag-row" id="tag-row" hidden></div>
  <nav class="chips" id="chips" aria-label="分類"></nav>
  <div id="sections">
    <div class="skeleton" id="skeleton" aria-hidden="true">
      <div class="sk-tile"><div class="sk-icon"></div><div class="sk-line"></div></div>
      <div class="sk-tile"><div class="sk-icon"></div><div class="sk-line"></div></div>
      <div class="sk-tile"><div class="sk-icon"></div><div class="sk-line"></div></div>
      <div class="sk-tile"><div class="sk-icon"></div><div class="sk-line"></div></div>
      <div class="sk-tile"><div class="sk-icon"></div><div class="sk-line"></div></div>
      <div class="sk-tile"><div class="sk-icon"></div><div class="sk-line"></div></div>
      <div class="sk-tile"><div class="sk-icon"></div><div class="sk-line"></div></div>
      <div class="sk-tile"><div class="sk-icon"></div><div class="sk-line"></div></div>
    </div>
  </div>
  <div class="empty" id="empty">
    <div class="empty-ico">🔎</div>
    <b>未有內容</b>
    <p>試下改關鍵字，或者撳「全部」／轉第二個分頁睇下</p>
  </div>

  <footer>
    <div class="tip">💡 <b>提示：</b>喺瀏覽器選單選「加入主畫面 / 安裝 App」（Android 可撳右上角「安裝」），呢個「童軍小工具」就會變成電話桌面嘅一個 App。所有童軍工具、圖卡、簡報同連結都由呢度入。</div>
    <span class="foot-meta" id="foot-count">載入中…</span>
    <div style="margin-top:16px">© 2026 Scout System</div>
  </footer>
</div>

<button class="to-top" id="to-top" type="button" aria-label="返回頂部">↑</button>

<div id="admin-panel" hidden>
  <div id="admin-content"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="store.js"></script>
<script src="admin.js"></script>
<script src="app.js"></script>
<script>
/* ════════════════════════════════════════════════════════════════
   啟動 boot：主題／安裝 PWA／返回頂部／金手指／路由
   （公開版面邏輯喺 app.js，管理面板喺 admin.js）
   ════════════════════════════════════════════════════════════════ */
const themeBtn = document.getElementById("theme-btn");
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  themeBtn.textContent = t === "dark" ? "☀️" : "🌙";
  localStorage.setItem("theme", t);
  const meta = document.querySelector('meta[name="theme-color"]:not([media])')
    || document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = t === "dark" ? "#0b0d12" : "#2563eb";
}
applyTheme(localStorage.getItem("theme") ||
  (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
themeBtn.onclick = () => {
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
  if (!isAdminRoute() && typeof rerenderPublic === "function") rerenderPublic();
};

const topbar = document.getElementById("topbar");
const toTopBtn = document.getElementById("to-top");
function measureHeader() {
  if (topbar) document.documentElement.style.setProperty("--header-h", topbar.offsetHeight + "px");
  if (typeof measurePanes === "function") measurePanes();
}
measureHeader();
window.addEventListener("resize", measureHeader);
window.addEventListener("scroll", () => {
  const y = window.scrollY || 0;
  topbar.classList.toggle("scrolled", y > 4);
  toTopBtn.classList.toggle("show", y > 480);
}, { passive: true });
toTopBtn.onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });

// PWA 一鍵安裝
const installBtn = document.getElementById("install-btn");
let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault(); deferredPrompt = e; installBtn.style.display = "flex";
});
installBtn.onclick = async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBtn.style.display = "none";
};
window.addEventListener("appinstalled", () => { installBtn.style.display = "none"; deferredPrompt = null; });

// 金手指：登入後連點 Logo 20 次 → 開啟改密碼
const GOLDENFINGER_TAPS = 20;
let _gfCount = 0, _gfLast = 0;
function goldfingerClick() {
  const now = Date.now();
  _gfCount = now - _gfLast < 900 ? _gfCount + 1 : 1;
  _gfLast = now;
  if (_gfCount < GOLDENFINGER_TAPS) return;
  _gfCount = 0;
  (async () => {
    const sb = getSB();
    if (!sb) return;
    const { data } = await sb.auth.getSession();
    if (data?.session) ADMIN.changePassword();
  })();
}

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch(() => {});
}

// 路由：管理面板 / 公開版面
function goRoute() {
  if (isAdminRoute()) {
    document.getElementById("admin-panel").hidden = false;
    ADMIN.init();
  } else {
    document.getElementById("admin-panel").hidden = true;
    main();
  }
}
goRoute();
window.addEventListener("hashchange", () => { measureHeader(); goRoute(); });
</script>

</body>
</html>
