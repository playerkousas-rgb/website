<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5" />
<title>童軍小工具</title>
<meta name="description" content="童軍小工具 — 童軍 Apps／學習圖卡／PPT／有用連結 的分類展示櫃，一個入口打開全部" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" type="image/png" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<meta name="theme-color" content="#0b0d12" />
<style>
/* === 原有變數保留，改做金色 Scout System 主題 === */
  :root {
    --bg: #0b0d12;
    --bg-elevated: #151922;
    --bg-card: #1a1f2e;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --border: rgba(255,255,255,.08);
    --border-strong: rgba(255,255,255,.14);
    --accent: #facc15; /* 童軍金 */
    --accent-2: #f59e0b;
    --accent-soft: rgba(250, 204, 21, .15);
    --accent-text: #fde68a;
    --shadow: 0 10px 30px rgba(0,0,0,.5);
    --radius: 20px;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang HK", sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden}
  .wrap{max-width:1024px;margin:0 auto;padding:16px}
  /* Topbar */
  .topbar{position:sticky;top:0;z-index:40;backdrop-filter:blur(16px);background:rgba(11,13,18,.8);border-bottom:1px solid var(--border);margin:-16px -16px 0;padding:12px 16px}
  .head-row{display:flex;align-items:center;gap:12px}
  .head-logo{width:40px;height:40px;border-radius:12px}
  .head-titles h1{font-size:20px;font-weight:800}
  /* === NEW HERO SPOTLIGHT === */
  .hero{position:relative;margin:24px 0 32px;padding:40px 20px 20px;overflow:hidden;border-radius:28px;background:radial-gradient(600px 400px at 50% 0%, rgba(250,204,21,.25), transparent 70%), linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.01));border:1px solid rgba(250,204,21,.25)}
  .hero-glow{position:absolute;top:-80px;left:50%;transform:translateX(-50%);width:500px;height:500px;background:radial-gradient(circle, rgba(250,204,21,.9) 0%, rgba(250,204,21,.4) 25%, transparent 70%);filter:blur(20px);pointer-events:none;animation:glowPulse 3s ease-in-out infinite}
  @keyframes glowPulse{0%,100%{opacity:.7;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.1)}}
  .hero-card{position:relative;z-index:2;max-width:480px;margin:0 auto;background:linear-gradient(180deg, rgba(26,31,46,.9), rgba(18,21,32,.95));border:1px solid rgba(250,204,21,.5);border-radius:20px;padding:20px;box-shadow:0 0 0 1px rgba(250,204,21,.2), 0 20px 60px rgba(250,204,21,.3), 0 0 80px rgba(250,204,21,.15)}
  .hero-badge{display:inline-block;background:#facc15;color:#000;font-weight:900;font-size:12px;padding:6px 14px;border-radius:999px;margin-bottom:12px;transform:rotate(-2deg)}
  .hero-icon-row{display:flex;gap:16px;align-items:center;margin-bottom:12px}
  .hero-icon{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg, #facc15, #f59e0b);display:flex;align-items:center;justify-content:center;font-size:34px;box-shadow:0 8px 20px rgba(250,204,21,.4)}
  .hero-title{font-size:24px;font-weight:900;line-height:1.2}
  .hero-sub{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.5}
  .hero-meta{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .hero-meta span{font-size:11px;background:rgba(255,255,255,.06);border:1px solid var(--border);padding:5px 10px;border-radius:999px}
  .hero-actions{display:flex;gap:10px;margin-top:18px}
  .btn-primary{flex:1;background:#facc15;color:#000;font-weight:800;border:none;border-radius:12px;padding:12px;font-size:15px;cursor:pointer;box-shadow:0 6px 16px rgba(250,204,21,.35)}
  .btn-secondary{flex:1;background:rgba(255,255,255,.06);color:var(--accent-text);border:1px solid rgba(250,204,21,.3);border-radius:12px;padding:12px;font-size:15px;cursor:pointer}
  /* === Blur others === */
  .sections-blur{filter:blur(6px);opacity:.45;transform:scale(.98);transition:all .5s ease;pointer-events:none}
  .sections-blur:hover{filter:blur(3px);opacity:.7}
  /* Original grid styles simplified */
  .grid{display:grid;gap:12px;grid-template-columns:repeat(4,1fr)}
  @media(min-width:600px){.grid{grid-template-columns:repeat(6,1fr)}}
  .tile{text-align:center;padding:8px}
  .tile-icon{width:64px;height:64px;margin:0 auto 6px;border-radius:16px;background:#1a1f2e;display:flex;align-items:center;justify-content:center;font-size:32px;border:1px solid var(--border)}
  .tile-name{font-size:12px;font-weight:600}
  .search{width:100%;padding:12px 40px;background:var(--bg-card);border:1px solid var(--border);border-radius:14px;color:#fff;margin-top:12px}
  .chips{display:flex;gap:8px;overflow-x:auto;margin-top:12px}
  .chip{white-space:nowrap;padding:8px 14px;border-radius:999px;background:var(--bg-card);border:1px solid var(--border);font-size:13px}
  .chip.on{background:#facc15;color:#000;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="head-row">
      <img class="head-logo" src="/icons/icon-192.png" alt="logo"/>
      <div class="head-titles"><h1>童軍小工具 · 應用商店</h1></div>
      <button class="chip" onclick="location.hash='#admin'" style="margin-left:auto">⚙️ 管理</button>
    </div>
    <input class="search" id="search" placeholder="🔍 搜尋工具、通告、訓練紀錄…"/>
    <div class="chips" id="chips"><span class="chip on">全部</span><span class="chip">通告</span><span class="chip">制服</span><span class="chip">露營</span><span class="chip">訓練</span></div>
  </div>

  <!-- === NEW: SPOTLIGHT HERO === -->
  <div class="hero" id="hero">
    <div class="hero-glow"></div>
    <div class="hero-card">
      <div class="hero-badge">今期主打</div>
      <div class="hero-icon-row">
        <div class="hero-icon">🔔</div>
        <div>
          <div class="hero-title">通告圖書館 v5.8</div>
          <div class="hero-sub">查看最新童軍通告、活動公告與文件下載 · 已整合推送訂閱</div>
        </div>
      </div>
      <div class="hero-meta">
        <span>🟢 更新 2026/09/12</span>
        <span>⭐ 4.9 · 2.1k 評分</span>
        <span>⬇️ 使用 8.4k+</span>
      </div>
      <div class="hero-actions">
        <button class="btn-primary" onclick="window.open('https://scout-circulars.vercel.app','_blank')">立即開啟</button>
        <button class="btn-secondary" onclick="document.getElementById('sections').scrollIntoView({behavior:'smooth'})">詳情</button>
      </div>
    </div>
  </div>

  <!-- === 原有 Sections，但加Blur === -->
  <div id="sections" class="sections-blur">
    <div class="grid">
      <div class="tile"><div class="tile-icon">🧣</div><div class="tile-name">制服工具</div></div>
      <div class="tile"><div class="tile-icon">📍</div><div class="tile-name">地圖考</div></div>
      <div class="tile"><div class="tile-icon">🔔</div><div class="tile-name">通告館</div></div>
      <div class="tile"><div class="tile-icon">📅</div><div class="tile-name">活動日曆</div></div>
      <div class="tile"><div class="tile-icon">🏕️</div><div class="tile-name">露營工具</div></div>
      <div class="tile"><div class="tile-icon">📚</div><div class="tile-name">訓練手冊</div></div>
      <div class="tile"><div class="tile-icon">🎖️</div><div class="tile-name">章級進度</div></div>
      <div class="tile"><div class="tile-icon">📝</div><div class="tile-name">考委系統</div></div>
    </div>
    <p style="text-align:center;margin-top:24px;color:#64748b;font-size:13px">👇 下面係你全部工具，上面係今期主打</p>
  </div>

  <footer style="text-align:center;margin-top:40px;color:#64748b;font-size:12px">© 2026 Scout System · 總入口 BLUR 其他，標亮今期</footer>
</div>

<script>
// 簡單切換：當搜尋時取消Blur，讓人搵到嘢
const search = document.getElementById('search');
const sections = document.getElementById('sections');
search.addEventListener('focus', ()=> sections.classList.remove('sections-blur'));
search.addEventListener('blur', ()=> { if(!search.value) sections.classList.add('sections-blur'); });
search.addEventListener('input', ()=> {
  if(search.value.length>0) sections.classList.remove('sections-blur');
  else sections.classList.add('sections-blur');
});
// 保留你原本 app.js 嘅邏輯：你只要將呢個 hero 區塊貼去你原本 index.html 嘅 <div id="sections"> 上面就得
</script>
<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
