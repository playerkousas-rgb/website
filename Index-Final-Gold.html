<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5" />
<title>童軍小工具</title>
<meta name="description" content="童軍小工具 — 童軍 Apps／學習圖卡／PPT／有用連結 的分類展示櫃" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" type="image/png" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<meta name="theme-color" content="#0b0d12" />
<style>
  :root {
    --bg: #0b0d12;
    --bg-elevated: #151922;
    --bg-card: #1a1f2e;
    --bg-card-hover: #22293e;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --border: rgba(255,255,255,.08);
    --border-strong: rgba(255,255,255,.14);
    --accent: #facc15;
    --accent-2: #f59e0b;
    --accent-soft: rgba(250,204,21,.15);
    --accent-text: #fde68a;
    --shadow: 0 10px 30px rgba(0,0,0,.5);
    --radius: 20px;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang HK", "Noto Sans TC", sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 480px at 12% -8%, rgba(250,204,21,.15), transparent 60%), radial-gradient(700px 420px at 100% 0%, rgba(245,158,11,.12), transparent 55%)}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1024px;margin:0 auto;padding:16px 16px 60px}
  /* Topbar - 金黑版 */
  .topbar{position:sticky;top:0;z-index:40;margin:-16px -16px 0;padding:12px 16px;background:rgba(11,13,18,.85);backdrop-filter:saturate(1.4) blur(16px);border-bottom:1px solid var(--border)}
  .head-row{display:flex;align-items:center;gap:12px}
  .head-logo{width:44px;height:44px;border-radius:14px;box-shadow:0 0 20px rgba(250,204,21,.3)}
  .head-titles h1{font-size:20px;font-weight:900;letter-spacing:-.02em}
  .head-actions{margin-left:auto;display:flex;gap:8px}
  .icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--border);background:var(--bg-card);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .install-btn{display:none;align-items:center;gap:6px;border:none;border-radius:999px;padding:10px 14px;background:linear-gradient(135deg, var(--accent), var(--accent-2));color:#000;font-weight:800;cursor:pointer}
  /* Search - 金黑版 */
  .search-wrap{position:relative;margin-top:14px}
  .search{width:100%;padding:14px 44px;border-radius:16px;font-size:16px;border:1px solid var(--border);background:var(--bg-card);color:var(--text);outline:none;transition:.15s}
  .search::placeholder{color:var(--muted)}
  .search:focus{border-color:rgba(250,204,21,.5);box-shadow:0 0 0 4px var(--accent-soft)}
  .search-ico{position:absolute;left:15px;top:50%;transform:translateY(-50%);opacity:.7}
  .search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:none;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;display:none}
  .search-clear.show{display:flex;align-items:center;justify-content:center}
  /* === HERO SPOTLIGHT === */
  .hero{position:relative;margin:20px 0 24px;padding:40px 20px 24px;overflow:hidden;border-radius:28px;background:radial-gradient(600px 400px at 50% 0%, rgba(250,204,21,.22), transparent 70%), linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.01));border:1px solid rgba(250,204,21,.25)}
  .hero-glow{position:absolute;top:-80px;left:50%;transform:translateX(-50%);width:520px;height:520px;background:radial-gradient(circle, rgba(250,204,21,.9) 0%, rgba(250,204,21,.4) 25%, transparent 70%);filter:blur(20px);pointer-events:none;animation:glowPulse 3s ease-in-out infinite}
  @keyframes glowPulse{0%,100%{opacity:.7;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.08)}}
  .hero-card{position:relative;z-index:2;max-width:520px;margin:0 auto;background:linear-gradient(180deg, rgba(26,31,46,.92), rgba(18,21,32,.98));border:1px solid rgba(250,204,21,.5);border-radius:20px;padding:20px;box-shadow:0 0 0 1px rgba(250,204,21,.15), 0 20px 60px rgba(250,204,21,.28), 0 0 80px rgba(250,204,21,.15)}
  .hero-badge{display:inline-block;background:#facc15;color:#000;font-weight:900;font-size:12px;padding:6px 14px;border-radius:999px;margin-bottom:14px;transform:rotate(-2deg)}
  .hero-icon-row{display:flex;gap:16px;align-items:center}
  .hero-icon{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg, #facc15, #f59e0b);display:flex;align-items:center;justify-content:center;font-size:34px;box-shadow:0 8px 20px rgba(250,204,21,.4);flex-shrink:0}
  .hero-title{font-size:24px;font-weight:900;line-height:1.2}
  .hero-sub{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.5}
  .hero-meta{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .hero-meta span{font-size:11px;background:rgba(255,255,255,.06);border:1px solid var(--border);padding:5px 10px;border-radius:999px}
  .hero-actions{display:flex;gap:10px;margin-top:18px}
  .btn-primary{flex:1;background:#facc15;color:#000;font-weight:800;border:none;border-radius:12px;padding:12px 16px;font-size:15px;cursor:pointer;box-shadow:0 6px 16px rgba(250,204,21,.35)}
  .btn-secondary{flex:1;background:rgba(255,255,255,.06);color:var(--accent-text);border:1px solid rgba(250,204,21,.3);border-radius:12px;padding:12px 16px;font-size:15px;cursor:pointer}
  /* Page nav / Chips / Tag row - 金黑版 */
  .page-nav, .chips, .tag-row{display:flex;gap:8px;overflow-x:auto;padding:10px 2px;scrollbar-width:none}
  .page-nav::-webkit-scrollbar, .chips::-webkit-scrollbar, .tag-row::-webkit-scrollbar{display:none}
  .page-btn, .chip, .tag-chip{flex-shrink:0;white-space:nowrap;cursor:pointer;font-weight:700;border-radius:999px;padding:10px 16px;font-size:14px;border:1px solid var(--border);background:var(--bg-card);color:var(--muted);transition:.18s}
  .page-btn.on, .chip.on, .tag-chip.on{color:#000;background:linear-gradient(135deg, var(--accent), var(--accent-2));border-color:transparent;box-shadow:0 5px 14px rgba(250,204,21,.3)}
  .page-nav{position:sticky;top:66px;z-index:30;background:rgba(11,13,18,.88);backdrop-filter:blur(12px)}
  /* Sections */
  #sections{min-height:200px}
  section{margin-top:24px;scroll-margin-top:140px}
  .sec-head{display:flex;align-items:center;gap:8px;margin-bottom:14px;padding:0 2px}
  .sec-head h2{font-size:16px;font-weight:800}
  .sec-head .num{font-size:12px;background:var(--bg-card);border:1px solid var(--border);border-radius:999px;padding:2px 8px;color:var(--muted)}
  .grid{display:grid;gap:14px 8px;grid-template-columns:repeat(4,1fr)}
  @media(min-width:560px){.grid{grid-template-columns:repeat(6,1fr)}}
  @media(min-width:900px){.grid{grid-template-columns:repeat(8,1fr)}}
  .tile{text-align:center;cursor:pointer;padding:6px;border-radius:16px;transition:.15s}
  .tile:hover{background:var(--bg-card)}
  .tile-icon{width:64px;height:64px;margin:0 auto 8px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:32px;background:var(--bg-card);border:1px solid var(--border);transition:.15s;position:relative}
  .tile:hover .tile-icon{transform:translateY(-3px);border-color:rgba(250,204,21,.4);box-shadow:0 8px 20px rgba(0,0,0,.3)}
  .tile-icon img{width:58px;height:58px;object-fit:contain;border-radius:14px}
  .tile-name{font-size:13px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tile-desc{font-size:11px;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .fav-star{position:absolute;top:-4px;right:-4px;width:20px;height:20px;font-size:12px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center}
  /* Blur control */
  .sections-blur{filter:blur(5px);opacity:.4;transform:scale(.98);transition:all .5s ease;pointer-events:none}
  .sections-blur.active{filter:blur(0);opacity:1;transform:scale(1);pointer-events:auto}
  .empty{text-align:center;padding:60px 20px;color:var(--muted);display:none}
  footer{text-align:center;color:var(--muted);font-size:13px;padding:40px 0 20px}
  .to-top{position:fixed;right:16px;bottom:20px;width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--bg-card);color:var(--text);display:none;align-items:center;justify-content:center;z-index:50;cursor:pointer}
  .to-top.show{display:flex}
  /* Admin panel keeps original */
  #admin-panel{position:fixed;inset:0;background:var(--bg);z-index:100;overflow-y:auto;padding:16px}
  .admin-card{max-width:680px;margin:16px auto;background:var(--bg-card);border:1px solid var(--border);border-radius:20px;padding:18px}
  .mini-btn{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:11px;padding:9px 13px;font-size:13px;cursor:pointer}
  .mini-btn.primary{background:linear-gradient(135deg, var(--accent), var(--accent-2));color:#000;border:none;font-weight:800}
  .admin-card input, .admin-card select{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:var(--text);margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar" id="topbar">
    <header>
      <div class="head-row">
        <img class="head-logo" src="/icons/icon-192.png" alt="Scout System" width="44" height="44" onclick="goldfingerClick()" />
        <div class="head-titles"><h1 id="site-name">童軍小工具</h1></div>
        <div class="head-actions">
          <button class="install-btn" id="install-btn" type="button">⬇ 安裝</button>
          <button class="icon-btn" id="theme-btn" type="button">🌙</button>
        </div>
      </div>
      <div class="search-wrap">
        <span class="search-ico">🔍</span>
        <input class="search" id="search" type="search" placeholder="搜尋工具、通告、訓練紀錄…" aria-label="搜尋" autocomplete="off" />
        <button class="search-clear" id="search-clear" type="button">×</button>
      </div>
    </header>
  </div>

  <!-- 分頁導覽 (保留你原本功能) -->
  <nav class="page-nav" id="page-nav" aria-label="分頁" hidden></nav>
  <!-- 級別篩選 (保留) -->
  <div class="tag-row" id="tag-row" hidden></div>
  <!-- 分類 Chips (保留) -->
  <nav class="chips" id="chips" aria-label="分類"></nav>

  <!-- ★★★ 新增：今期主打 Spotlight ★★★ -->
  <div class="hero" id="hero-spotlight">
    <div class="hero-glow"></div>
    <div class="hero-card">
      <div class="hero-badge">今期主打</div>
      <div class="hero-icon-row">
        <div class="hero-icon">🔔</div>
        <div>
          <div class="hero-title">通告圖書館 v5.8</div>
          <div class="hero-sub">查看最新童軍通告、活動公告與文件下載 · 已整合推送訂閱</div>
        </div>
      </div>
      <div class="hero-meta">
        <span>🟢 更新 2026/09/12</span>
        <span>⭐ 4.9 · 2.1k 評分</span>
        <span>⬇️ 使用 8.4k+</span>
      </div>
      <div class="hero-actions">
        <button class="btn-primary" onclick="window.open('https://scout-circulars.vercel.app','_blank')">立即開啟</button>
        <button class="btn-secondary" onclick="document.getElementById('sections').classList.add('active'); document.getElementById('sections').scrollIntoView({behavior:'smooth'})">查看全部工具</button>
      </div>
    </div>
  </div>

  <!-- 原有 Sections (下面全部會 Blur，直到用戶搜尋/點擊) -->
  <div id="sections">
    <div class="skeleton" id="skeleton" aria-hidden="true" style="display:grid;gap:14px;grid-template-columns:repeat(4,1fr);margin-top:22px">
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:60px;height:60px;background:#1a1f2e;border-radius:16px"></div><div style="width:60%;height:10px;background:#1a1f2e;border-radius:6px"></div></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:60px;height:60px;background:#1a1f2e;border-radius:16px"></div><div style="width:60%;height:10px;background:#1a1f2e;border-radius:6px"></div></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:60px;height:60px;background:#1a1f2e;border-radius:16px"></div><div style="width:60%;height:10px;background:#1a1f2e;border-radius:6px"></div></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:60px;height:60px;background:#1a1f2e;border-radius:16px"></div><div style="width:60%;height:10px;background:#1a1f2e;border-radius:6px"></div></div>
    </div>
  </div>
  <div class="empty" id="empty"><div style="font-size:40px;margin-bottom:12px">🔎</div><b>未有內容</b><p>試下改關鍵字，或者撳「全部」睇下</p></div>

  <footer>
    <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:16px;text-align:left;max-width:560px;margin:0 auto 18px">💡 <b>提示：</b>喺瀏覽器選單選「加入主畫面 / 安裝 App」，呢個「童軍小工具」就會變成桌面App。所有工具都由呢度入。</div>
    <span id="foot-count">載入中…</span><div style="margin-top:12px">© 2026 Scout System · App Store Edition</div>
  </footer>
</div>
<button class="to-top" id="to-top" type="button">↑</button>
<div id="admin-panel" hidden><div id="admin-content"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="store.js"></script>
<script src="admin.js"></script>
<script src="app.js"></script>
<script>
const themeBtn=document.getElementById("theme-btn");
function applyTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem("theme",t);themeBtn.textContent=t==="dark"?"☀":"🌙"}
applyTheme(localStorage.getItem("theme")||"dark");
themeBtn.onclick=()=>applyTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
const topbar=document.getElementById("topbar");
const toTopBtn=document.getElementById("to-top");
window.addEventListener("scroll",()=>{topbar.classList.toggle("scrolled",(window.scrollY||0)>4);toTopBtn.classList.toggle("show",(window.scrollY||0)>480)},{passive:true});
toTopBtn.onclick=()=>window.scrollTo({top:0,behavior:"smooth"});
// PWA
const installBtn=document.getElementById("install-btn");let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",(e)=>{e.preventDefault();deferredPrompt=e;installBtn.style.display="flex"});
installBtn.onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.style.display="none"};
// Blur 邏輯：預設Blur下面，搜尋/點擊就取消
const sectionsEl=document.getElementById("sections");
const searchEl=document.getElementById("search");
const searchClear=document.getElementById("search-clear");
let isBlurred=true;
function setBlur(b){
  if(b){sectionsEl.classList.remove("active");sectionsEl.classList.add("sections-blur");isBlurred=true}
  else{sectionsEl.classList.add("active");sectionsEl.classList.remove("sections-blur");isBlurred=false}
}
setBlur(true);
searchEl.addEventListener("focus",()=>setBlur(false));
searchEl.addEventListener("input",()=>{
  const hasVal=searchEl.value.trim().length>0;
  searchClear.classList.toggle("show",hasVal);
  if(hasVal) setBlur(false);
});
searchClear.onclick=()=>{searchEl.value="";searchClear.classList.remove("show");searchEl.focus();setBlur(true);if(typeof rerenderPublic==="function") rerenderPublic()};
// 金手指
let _gfCount=0,_gfLast=0;
function goldfingerClick(){const now=Date.now();_gfCount=now-_gfLast<900?_gfCount+1:1;_gfLast=now;if(_gfCount<20)return;_gfCount=0;(async()=>{const sb=getSB();if(!sb)return;const {data}=await sb.auth.getSession();if(data?.session) ADMIN.changePassword()})()}
function isAdminRoute(){return location.hash.startsWith("#admin")}
function goRoute(){if(isAdminRoute()){document.getElementById("admin-panel").hidden=false;ADMIN.init()}else{document.getElementById("admin-panel").hidden=true;if(typeof main==="function") main()}}
goRoute();window.addEventListener("hashchange",goRoute);
if("serviceWorker"in navigator){navigator.serviceWorker.register("/sw.js").catch(()=>{})}
</script>
</body>
</html>
